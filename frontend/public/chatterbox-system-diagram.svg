<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ChatterBox deployment topology</title>
  <desc id="desc">Browser clients use HTTP and Socket.IO to connect to one Node container. Express serves the React build, REST routes, and authenticated Socket.IO rooms. PostgreSQL stores persistent records. Redis holds presence, cache, unread counts, notification cooldowns, and reminders. Notifications go separately to ntfy and Resend; optional avatar uploads go to S3-compatible storage. In-process connection state, rate limits, and the reminder sweep require a single-instance deployment.</desc>
  <defs>
    <marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#172437"/></marker>
    <marker id="live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#2457e6"/></marker>
    <marker id="store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#087f80"/></marker>
    <marker id="notify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#b76408"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172437">
    <text x="32" y="36" font-size="13" letter-spacing="2" fill="#64748b">CHATTERBOX / DEPLOYMENT TOPOLOGY</text>
    <g font-size="13" fill="#64748b">
      <path d="M32 62 H62" stroke="#172437" stroke-width="2"/><text x="72" y="67">HTTP / SQL</text>
      <path d="M200 62 H230" stroke="#2457e6" stroke-width="2"/><text x="240" y="67">Real-time</text>
      <path d="M360 62 H390" stroke="#087f80" stroke-width="2"/><text x="400" y="67">Data store</text>
      <path d="M520 62 H550" stroke="#b76408" stroke-width="2" stroke-dasharray="6 4"/><text x="560" y="67">Out-of-band notification</text>
    </g>
    <rect x="300" y="104" width="560" height="475" rx="8" fill="#f0f3f8" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="320" y="130" font-family="monospace" font-size="12" fill="#64748b">SINGLE APP PROCESS · ONE ORIGIN · PLATFORM HTTPS PROXY</text>
    <g fill="#fff" stroke="#94a3b8" stroke-width="1.3">
      <rect x="32" y="193" width="204" height="235" rx="6"/>
      <rect x="320" y="151" width="520" height="261" rx="6"/>
      <rect x="938" y="168" width="230" height="81" rx="6"/>
      <rect x="938" y="288" width="230" height="81" rx="6"/>
      <rect x="938" y="425" width="230" height="81" rx="6"/>
    </g>
    <text x="50" y="222" font-size="16" font-weight="700">Browser</text>
    <text x="50" y="245" font-family="monospace" font-size="12" fill="#64748b">React SPA · Vite build</text>
    <g fill="#f3f5f9" stroke="#d5dce6">
      <rect x="50" y="267" width="168" height="34" rx="4"/>
      <rect x="50" y="311" width="168" height="34" rx="4"/>
      <rect x="340" y="194" width="480" height="51" rx="4"/>
      <rect x="340" y="257" width="480" height="51" rx="4"/>
      <rect x="340" y="320" width="480" height="51" rx="4"/>
    </g>
    <text x="134" y="289" text-anchor="middle" font-size="14">Visitor</text>
    <text x="134" y="333" text-anchor="middle" font-size="14">Owner</text>
    <text x="50" y="379" font-family="monospace" font-size="12" fill="#64748b">axios + socket.io-client</text>
    <text x="50" y="402" font-family="monospace" font-size="12" fill="#64748b">same origin</text>
    <text x="340" y="177" font-size="16" font-weight="700">App container</text>
    <text x="468" y="177" font-family="monospace" font-size="12" fill="#64748b">Node 22 · Express · Socket.IO</text>
    <text x="354" y="214" font-size="14" font-weight="700">Express static</text>
    <text x="354" y="234" font-family="monospace" font-size="12" fill="#64748b">client/dist + SPA fallback</text>
    <text x="354" y="277" font-size="14" font-weight="700">REST API</text>
    <text x="354" y="297" font-family="monospace" font-size="12" fill="#64748b">auth · users · conversations · messages · contacts</text>
    <text x="354" y="340" font-size="14" font-weight="700" fill="#2457e6">Socket.IO</text>
    <text x="354" y="360" font-family="monospace" font-size="12" fill="#64748b">JWT handshake · rooms · presence · messaging</text>
    <text x="340" y="395" font-family="monospace" font-size="12" fill="#64748b">IN PROCESS: connections · rate limits · reminder sweep</text>
    <g fill="none" stroke-width="1.8">
      <path d="M236 282 H340" stroke="#172437" marker-end="url(#request)"/>
      <path d="M240 344 H335" stroke="#2457e6" marker-start="url(#live)" marker-end="url(#live)"/>
      <path d="M450 412 V477" stroke="#087f80" marker-end="url(#store)"/>
      <path d="M710 417 V477" stroke="#087f80" marker-start="url(#store)" marker-end="url(#store)"/>
      <path d="M840 208 H938" stroke="#b76408" stroke-dasharray="6 4" marker-end="url(#notify)"/>
      <path d="M840 329 H938" stroke="#b76408" stroke-dasharray="6 4" marker-end="url(#notify)"/>
      <path d="M840 393 H889 V465 H938" stroke="#172437" marker-end="url(#request)"/>
    </g>
    <g font-family="monospace" font-size="11" fill="#64748b">
      <text x="258" y="272">HTTPS</text><text x="268" y="332" fill="#2457e6">WSS</text>
      <text x="355" y="449">SQL · pg pool</text><text x="620" y="449">get/set · pub/sub</text>
      <text x="868" y="194" fill="#b76408">POST</text><text x="868" y="316" fill="#b76408">POST</text><text x="897" y="451">PUT</text>
    </g>
    <g fill="#fff" stroke="#087f80" stroke-width="1.5">
      <rect x="340" y="481" width="220" height="76" rx="5"/>
      <rect x="600" y="481" width="220" height="76" rx="5"/>
    </g>
    <text x="354" y="504" font-size="15" font-weight="700" fill="#087f80">PostgreSQL</text>
    <text x="354" y="525" font-family="monospace" font-size="11" fill="#64748b">users · sessions · contacts</text>
    <text x="354" y="543" font-family="monospace" font-size="11" fill="#64748b">conversations · messages · status</text>
    <text x="614" y="504" font-size="15" font-weight="700" fill="#087f80">Redis</text>
    <text x="614" y="525" font-family="monospace" font-size="11" fill="#64748b">presence · cache · unread</text>
    <text x="614" y="543" font-family="monospace" font-size="11" fill="#64748b">cooldowns · reminders · adapter</text>
    <text x="956" y="197" font-size="15" font-weight="700">ntfy</text><text x="956" y="224" font-family="monospace" font-size="12" fill="#64748b">Push to owner's phone</text>
    <text x="956" y="317" font-size="15" font-weight="700">Resend</text><text x="956" y="344" font-family="monospace" font-size="12" fill="#64748b">Owner + visitor emails</text>
    <text x="956" y="454" font-size="15" font-weight="700">S3 / MinIO (optional)</text><text x="956" y="481" font-family="monospace" font-size="12" fill="#64748b">Avatar uploads</text>
    <text x="32" y="612" font-size="13" fill="#64748b">Messages are stored before broadcast. Notifications run after delivery, with timeouts and Redis throttling.</text>
    <text x="32" y="634" font-size="12" fill="#64748b">Deployment model from the repository; not a claim of a currently live public service.</text>
  </g>
</svg>
