<svg xmlns="http://www.w3.org/2000/svg" width="480" height="830" viewBox="0 0 480 830" role="img" aria-labelledby="title description">
  <title id="title">termshare system architecture</title>
  <desc id="description">Host and viewer browsers use xterm.js and connect over WebSockets to a Go server. The server finds the session, checks write permissions, replays recent output, and broadcasts terminal output. Authorized input passes to a Unix pseudo-terminal connected to a shell. Viewers are read-only unless the host enables typing. Only the host can resize the terminal or change permissions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#53695f"/></marker>
  </defs>
  <rect width="480" height="830" fill="#f8faf8"/>
  <g font-family="Arial, sans-serif" fill="#23372e">
    <text x="28" y="44" font-size="24" font-weight="700">termshare</text>
    <text x="28" y="70" font-size="15" fill="#53695f">One shell, shared with browser terminals.</text>
    <g fill="#ffffff" stroke="#cad6ce" stroke-width="1.5">
      <rect x="28" y="100" width="198" height="104" rx="10"/>
      <rect x="254" y="100" width="198" height="104" rx="10"/>
      <rect x="28" y="290" width="424" height="212" rx="10"/>
      <rect x="28" y="585" width="424" height="75" rx="10"/>
      <rect x="28" y="714" width="424" height="75" rx="10"/>
    </g>
    <text x="44" y="129" font-size="17" font-weight="700">Host browser</text>
    <text x="44" y="155" font-size="14">xterm.js + host key</text>
    <text x="44" y="180" font-size="14">Type · resize · permissions</text>
    <text x="270" y="129" font-size="17" font-weight="700">Viewer browsers</text>
    <text x="270" y="155" font-size="14">xterm.js + session ID</text>
    <text x="270" y="180" font-size="14">Read-only by default</text>
    <g stroke="#53695f" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M127 211 V283"/>
      <path d="M353 211 V283"/>
      <path d="M240 510 V577"/>
      <path d="M240 668 V706"/>
    </g>
    <rect x="45" y="228" width="390" height="45" rx="4" fill="#f8faf8"/>
    <text x="240" y="245" text-anchor="middle" font-size="14">WebSockets: terminal bytes + JSON controls</text>
    <text x="240" y="266" text-anchor="middle" font-size="12" fill="#53695f">Viewer input is accepted only when enabled by the host.</text>
    <text x="48" y="322" font-size="19" font-weight="700">Go HTTP / WebSocket server</text>
    <text x="48" y="349" font-size="14" fill="#53695f">Serves the UI · /s/{id}/ws · session registry</text>
    <path d="M48 368 H432" stroke="#cad6ce"/>
    <text x="48" y="396" font-size="17" font-weight="700">Shared session</text>
    <text x="48" y="423" font-size="15">Host key + write-permission checks</text>
    <text x="48" y="449" font-size="15">Recent output replay · up to 256 KiB</text>
    <text x="48" y="475" font-size="15">Output fan-out · bounded client queues</text>
    <text x="260" y="546" font-size="13" fill="#53695f">Input ↓ / output ↑</text>
    <text x="48" y="615" font-size="18" font-weight="700">Unix pseudo-terminal (PTY)</text>
    <text x="48" y="640" font-size="14" fill="#53695f">Terminal I/O and host-controlled resizing</text>
    <text x="260" y="692" font-size="13" fill="#53695f">Shell I/O</text>
    <text x="48" y="744" font-size="18" font-weight="700">Shell process</text>
    <text x="48" y="769" font-size="14" fill="#53695f">$SHELL, or bash if unset · one shell per process</text>
    <text x="240" y="816" text-anchor="middle" font-size="12" fill="#53695f">Trusted LAN / VPN · no built-in HTTPS or tunneling</text>
  </g>
</svg>
